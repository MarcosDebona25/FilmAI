<div class="bg-surface-container-high rounded-xl p-lg md:p-xl shadow-2xl backdrop-blur-md relative overflow-hidden border border-outline-variant/30">
<!-- Avatar Edit Section -->
<div class="flex flex-col md:flex-row items-center gap-lg mb-xl">
<div class="relative group cursor-pointer w-24 h-24 rounded-full overflow-hidden">
<img alt="Avatar" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110" data-alt="A detailed, professional avatar portrait of a man with cinematic rim lighting, deep shadows, and a subtle golden glow in the background. High quality, crisp focus." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDj-rHWuSsCOEZFKbVSoZbmFVt6YPB9TgDk7NoOzq0XPiIOKr5-YGT5-uP5-3r9siYuMDJDvN56TVaG4JVAfsjY-i6rsHzRbrANTLeOZgIZAGi1nKZk50BSoPMffZGYPm5aO7XbjCd1XJUb0f1s4mE96MQIQPWusX6qg062lWmQufX-xvIgABvoLLUbpxw45QsrU14ka2DdBZd2A5k6TbIybbbltcYDiKnX3Oefy8KOo9252ZVukdDTLtN7ygIldpr1lKkw5guoiCs"/>
<div class="absolute inset-0 bg-background/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-on-surface mb-xs" data-icon="photo_camera">photo_camera</span>
<span class="font-label-sm text-label-sm text-on-surface">Cambiar</span>
</div>
</div>
</div>
<div class="text-center md:text-left flex-1">
<h2 class="font-title-lg text-title-lg text-on-surface">Marco López</h2>
<p class="font-body-md text-body-md text-on-surface-variant">marco.lopez@example.com</p>
</div>
</div>
<form class="space-y-md">
<!-- Inline Edit Fields -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="firstName">Nombre</label>
<input class="w-full bg-surface border border-[#333333] rounded DEFAULT px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="firstName" type="text" value="Marco"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="lastName">Apellido</label>
<input class="w-full bg-surface border border-[#333333] rounded DEFAULT px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="lastName" type="text" value="López"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="username">Nombre de usuario</label>
<div class="relative">
<input class="w-full bg-surface border border-[#333333] rounded DEFAULT px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors pr-[100px]" id="username" type="text" value="@marco_lopez"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-md pointer-events-none">
<span class="font-label-sm text-label-sm text-[#4CAF50] flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="check_circle">check_circle</span>
                                 Disponible
                             </span>
</div>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-xs" for="email">
                         Email 
                         <span class="material-symbols-outlined text-[16px] text-on-surface-variant/50" data-icon="lock" title="Solo lectura">lock</span>
</label>
<input class="w-full bg-surface-container-low border border-[#333333]/50 rounded DEFAULT px-md py-sm font-body-md text-body-md text-on-surface-variant/70 cursor-not-allowed" disabled="" id="email" type="email" value="marco.lopez@example.com"/>
</div>
<!-- Collapsible Password Section -->
<div class="mt-lg border border-[#333333] rounded-lg overflow-hidden">
<button class="w-full bg-surface-container flex items-center justify-between p-md hover:bg-surface-container-highest transition-colors" onclick="document.getElementById('password-section').classList.toggle('hidden'); this.querySelector('.chevron').classList.toggle('rotate-180')" type="button">
<span class="font-title-lg text-title-lg text-on-surface">Cambiar contraseña</span>
<span class="material-symbols-outlined text-on-surface-variant chevron transition-transform duration-300" data-icon="expand_more">expand_more</span>
</button>
<div class="hidden bg-surface p-md space-y-md border-t border-[#333333]" id="password-section">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="currentPassword">Contraseña actual</label>
<input class="w-full bg-surface-container-low border border-[#333333] rounded DEFAULT px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="currentPassword" type="password"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="newPassword">Nueva contraseña</label>
<input class="w-full bg-surface-container-low border border-[#333333] rounded DEFAULT px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="newPassword" type="password"/>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex justify-end gap-md mt-xl pt-lg border-t border-outline-variant/20">
<button class="px-lg py-sm font-label-md text-label-md text-on-surface hover:text-on-surface-variant transition-colors bg-transparent border border-outline-variant/50 rounded-full" type="button">
                         Cancelar
                     </button>
<button class="px-lg py-sm font-label-md text-label-md text-background bg-primary-container hover:bg-surface-tint transition-colors rounded-full font-bold shadow-[0_4px_14px_0_rgba(245,197,24,0.39)]" type="submit">
                         Guardar cambios
                     </button>
</div>
</form>
