<style>
        .glass-panel {
            background: rgba(26, 26, 46, 0.6);
            backdrop-filter: blur(16px);

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
<!-- Cinematic Background Image -->
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-cover bg-center opacity-30" data-alt="A deeply atmospheric cinematic background featuring abstract light leaks, soft film grain, and dark, brooding shadows. The scene evokes the feeling of a premium, classic movie theater just before the film starts, with subtle golden reflections dancing on deeply textured, dark surfaces. The lighting is low-key, moody, and highly professional, setting a sophisticated tone without distracting from foreground elements." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDx2rDTslqMFP9vRnSHEkMS2-LiZfe9nz15xj7bxAs7flIyCDrYOx1Y-xFOAcllnVcDE7fWtjW59JEmGr-Rv25N-qdOSmbfSN0YCI56PZZWbzH4kULbqE8wB8jVRi_qPCUBM1ICTFlOQ5zNpLt2L4e-S8GKGnleeRfiViaCysJ7iqdBNB7Yg2yVapsdQMFDatsCJJmZrTYieThpRbu1roZTQuey-zdmjcj1158JlaspkDQ0F2JXPdLWk-yKwKxBnwRwupJneLiQ49g')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/80 to-transparent"></div>
<div class="absolute inset-0 bg-gradient-to-r from-background via-transparent to-background hidden md:block"></div>
</div>
<!-- Main Container -->
<main class="w-full max-w-md relative z-10 glass-panel rounded-xl shadow-[0_20px_40px_rgba(0,0,0,0.6)] p-xl border border-surface-bright/20 flex flex-col items-center">
<!-- Logo -->
<div class="mb-xl text-center flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">movie</span>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">FilmIA</h1>
</div>
<!-- Form -->
<form action="#" class="w-full flex flex-col gap-lg" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email o Usuario</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 pointer-events-none">mail</span>
<input class="w-full bg-[#1A1A2E] border border-[#333333] text-on-surface font-body-md text-body-md rounded pl-10 pr-3 py-2.5 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors placeholder:text-on-surface-variant/30" id="email" name="email" placeholder="tu@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Contraseña</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 pointer-events-none">lock</span>
<input class="w-full bg-[#1A1A2E] border border-[#333333] text-on-surface font-body-md text-body-md rounded pl-10 pr-10 py-2.5 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors placeholder:text-on-surface-variant/30" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/70 hover:text-primary transition-colors focus:outline-none focus:text-primary" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="visibilityIcon">visibility_off</span>
</button>
</div>
<div class="flex justify-end mt-1">
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors underline-offset-2 hover:underline" href="#">¿Olvidaste tu contraseña?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-surface-container-lowest font-label-md text-label-md py-3 rounded-lg font-bold hover:bg-primary-fixed hover:scale-[1.02] active:scale-95 transition-all mt-sm shadow-[0_4px_14px_rgba(245,197,24,0.2)]" type="submit">
                Iniciar sesión
            </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-md my-lg opacity-60">
<div class="h-px bg-outline flex-1"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">O</span>
<div class="h-px bg-outline flex-1"></div>
</div>
<!-- Google Login -->
<button class="w-full bg-transparent border border-outline text-on-surface font-label-md text-label-md py-3 rounded-lg hover:bg-surface-bright/20 hover:border-on-surface transition-all flex items-center justify-center gap-sm active:scale-95 group" type="button">
<svg class="w-5 h-5 text-current group-hover:scale-110 transition-transform" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Continuar con Google
        </button>
<!-- Register Link -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                ¿No tenés cuenta? 
                <a class="text-primary font-bold hover:text-primary-fixed transition-colors underline-offset-4 hover:underline ml-1" href="#">Registrate</a>
</p>
</div>
</main>
<script>
        // Password Visibility Toggle
        document.addEventListener('DOMContentLoaded', () => {
            const toggleButton = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');

            toggleButton.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                if (type === 'password') {
                    visibilityIcon.textContent = 'visibility_off';
                } else {
                    visibilityIcon.textContent = 'visibility';
                }
            });
        });
    </script>
</body></html>
