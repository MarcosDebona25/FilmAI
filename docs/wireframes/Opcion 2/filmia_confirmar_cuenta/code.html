<style>
        .glass-panel {
            background: linear-gradient(145deg, rgba(32, 31, 31, 0.7) 0%, rgba(28, 27, 27, 0.4) 100%);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
        }

<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-sans selection:bg-primary-container selection:text-on-primary-container">
<!-- Cinematic Background Plate -->
<div class="absolute inset-0 z-0 bg-cover bg-center opacity-40 mix-blend-luminosity" data-alt="A highly atmospheric, cinematic abstract background. Deep, inky blacks and dark indigo tones are pierced by subtle, out-of-focus golden light flares, creating a moody, premium theater environment. The texture is slightly grainy, reminiscent of 35mm film stock, providing a sophisticated backdrop for a modern user interface without distracting details." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC9gz9ruuIAix0fswyDDPLCXVZT0VeZxtC_XCiSV-xrcJVuihLKp-qyZm1cnS5HuyajqK3tRP8EVbEdQJMwu5etVwpnOHKK9VhydcgzbZIe5X4JgD2XlN2IpRtF1qxXXLzGd7XuGQxgAzDLa4AozhSZ1vL3QYMBGINMHCO0I6hbyAm5uoTm5MbjZ5Mw0TnPczyjne2QmWdNrGCxI_vU7qSaqWVGKJx5E-qvzADyl3lsNSWgydZ_5mlcAIQcJKawBNS_itObg9-xVak')">
</div>
<!-- Ambient Gradient Overlay -->
<div class="absolute inset-0 z-0 bg-gradient-to-t from-background via-background/80 to-transparent"></div>
<div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_center,rgba(245,197,24,0.03)_0%,transparent_70%)]"></div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-[420px] px-margin-mobile md:px-0">
<!-- Glassmorphic Confirmation Card -->
<div class="glass-panel backdrop-blur-xl border border-outline-variant/30 rounded-xl p-xl flex flex-col items-center text-center transform transition-all duration-500 translate-y-0 opacity-100 animate-[fadeInUp_0.6s_ease-out]">
<!-- Icon Highlight -->
<div class="w-20 h-20 rounded-full bg-surface-container flex items-center justify-center mb-lg border border-outline-variant/50 shadow-[0_0_30px_rgba(245,197,24,0.15)] relative group">
<div class="absolute inset-0 rounded-full bg-primary-container/20 blur-md opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<span class="material-symbols-outlined text-[36px] text-primary-container z-10" style="font-variation-settings: 'FILL' 1;">mail</span>
</div>
<!-- Typography & Copy -->
<h1 class="font-headline-sm text-headline-sm md:font-headline-md md:text-headline-md text-on-surface mb-md tracking-tight">
                Revisá tu bandeja de entrada
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl leading-relaxed">
                Enviamos un enlace de confirmación a<br/>
<span class="text-on-surface font-semibold tracking-wide">marco@email.com</span>.<br/>
                Hacé clic en él para verificar tu identidad y acceder a la experiencia completa.
            </p>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-3 px-lg rounded-lg hover:brightness-110 transition-all duration-200 active:scale-[0.98] mb-gutter flex items-center justify-center gap-sm font-bold shadow-lg shadow-primary-container/20" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'wght' 600;">forward_to_inbox</span>
                Reenviar enlace
            </button>
<!-- Secondary Navigation -->
<div class="pt-sm border-t border-outline-variant/30 w-full">
<a class="inline-flex items-center gap-xs font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors duration-200 group" href="#">
                    ¿Ya confirmaste? 
                    <span class="text-primary group-hover:underline underline-offset-4 decoration-primary/50 flex items-center">
                        Iniciar sesión
                        <span class="material-symbols-outlined text-[14px] ml-1 transition-transform group-hover:translate-x-1">arrow_forward</span>
</span>
</a>
</div>
</div>
</main>
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
