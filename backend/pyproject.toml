# =============================================================================
# FilmAI Backend — Configuración de Ruff (linter + formatter)
# =============================================================================
# Ruff se usa para linting Y formateo. `ruff format` reemplaza a `black`
# (es un formatter compatible: mismo line-length y estilo). Ver docs/decisiones.md.

[tool.ruff]
target-version = "py312"
line-length = 88
# Las migraciones son autogeneradas por Django; no se lintean ni formatean a mano.
exclude = [
    "*/migrations/*",
]

[tool.ruff.lint]
# E501 (línea larga) se omite a propósito: la longitud la controla el
# formatter (`ruff format`). Se seleccionan E4/E7/E9 (errores de pycodestyle
# que NO solapa el formatter) en lugar de "E" completo.
select = [
    "E4",  # pycodestyle: imports, whitespace, blank lines
    "E7",  # pycodestyle: statements
    "E9",  # pycodestyle: runtime errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (orden de imports)
    "UP",  # pyupgrade (sintaxis moderna)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # reglas específicas de ruff
]

[tool.ruff.lint.per-file-ignores]
# Django: `ordering`, `constraints` y `REQUIRED_FIELDS` son metadatos del modelo,
# no defaults mutables compartidos entre instancias. RUF012 es un falso positivo.
"*/models.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
