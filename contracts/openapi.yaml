          - account_deactivated
          - account_pending_confirmation
          - already_confirmed
          - avatar_invalid
          - birth_date_in_future
          - blank
          - country_invalid
          - current_password_incorrect
          - default_list_protected
          - documentation_staff_required
          - email_already_used
          - email_or_username_already_used
          - google_authentication_failed
          - invalid
          - invalid_choice
          - invalid_credentials
          - invalid_token
          - link_expired
          - link_invalid
          - list_item_duplicated
          - list_items_limit_reached
          - list_limit_reached
          - list_name_duplicated
          - list_name_invalid_characters
          - list_name_missing_alphanumeric
          - list_name_reserved
          - local_password_unavailable
          - max_length
          - max_value
          - method_not_allowed
          - min_length
          - min_value
          - minimum_age
          - not_a_dict
          - not_acceptable
          - not_authenticated
          - not_found
          - 'null'
          - number_not_finite
          - parse_error
          - password_entirely_numeric
          - password_no_digit
          - password_no_lower
          - password_no_special
          - password_no_upper
          - password_too_common
          - password_too_short
          - password_too_short_or_long
          - password_too_similar
          - passwords_do_not_match
          - permission_denied
          - person_name_invalid
          - rating_blocks_removal_from_watched
          - rating_duplicated
          - required
          - review_update_empty
          - server_error
          - session_revoked
          - terms_not_accepted
          - throttled
          - unique
          - unsupported_media_type
          - upstream_bad_request
          - upstream_error
          - upstream_not_found
          - upstream_unavailable
          - username_already_used
          - username_invalid
          - username_not_allowed
          - validation_error
        params:
          type: object
          description: Valores de máquina; nunca texto para mostrar.
          additionalProperties: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorEntry'
        debug:
          type: object
