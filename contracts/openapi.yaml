components:
  schemas:
    CambiarContrasena:
      type: object
      description: Adjunta metadata después de que Serializer.is_valid reconstruye
        errores.
      properties:
        old_password:
          type: string
          writeOnly: true
        password1:
          type: string
          writeOnly: true
        password2:
          type: string
          writeOnly: true
      required:
      - old_password
      - password1
      - password2
    EstadoEnum:
      enum:
      - pendiente
      - activa
      - baja
      type: string
      description: |-
        * `pendiente` - Pendiente de confirmación
        * `activa` - Activa
        * `baja` - Baja
    GeneroEnum:
      enum:
      - masculino
      - femenino
      - no_especifica
      type: string
      description: |-
        * `masculino` - Masculino
        * `femenino` - Femenino
        * `no_especifica` - No especifica
    GoogleSocialLogin:
      type: object
      description: Login y registro con Google mediante ``id_token``.
      properties:
        access_token:
          type: string
        id_token:
          type: string
        nombre_usuario:
          type: string
          maxLength: 25
        fecha_nacimiento:
          type: string
          format: date
        genero:
          $ref: '#/components/schemas/GeneroEnum'
        pais:
          type: string
          maxLength: 2
        acepta_terminos:
          type: boolean
    Idioma704Enum:
      enum:
      - en
      - es
      type: string
      description: |-
        * `en` - en
        * `es` - es
    Idioma90bEnum:
      enum:
      - en
      - es
      type: string
      description: |-
        * `en` - English
        * `es` - Español
    Login:
      type: object
      description: Login por credenciales con errores específicos para cuentas inactivas.
      properties:
        username:
          type: string
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        password:
          type: string
      required:
      - password
    NullEnum:
      enum:
      - null
    PatchedUsuarioDetalles:
      type: object
      description: |-
        Representación del usuario autenticado (endpoints `/api/auth/user/`).

        El serializer por defecto de dj-rest-auth usa `username`/`email`/
        `first_name`/`last_name`, que no existen en `usuarios.Usuario`.
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        correo:
          type: string
          format: email
          readOnly: true
          title: Correo electrónico
          description: Formato correo@dominio.com (CU-001).
        nombre_usuario:
          type: string
          readOnly: true
          title: Nombre de usuario
          description: Alfanumérico, 5-25 caracteres, único (CU-001).
        nombre:
          type: string
          readOnly: true
        apellido:
          type: string
          readOnly: true
        fecha_nacimiento:
          type: string
          format: date
          readOnly: true
          title: Fecha de nacimiento
        genero:
          allOf:
          - $ref: '#/components/schemas/GeneroEnum'
          readOnly: true
          title: Género
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoEnum'
          readOnly: true
          title: Estado de cuenta
        avatar_id:
          type: integer
          readOnly: true
          title: Id de avatar
          description: Identificador dentro del conjunto de  avatares
        fecha_registro:
          type: string
          format: date
          readOnly: true
          title: Fecha de registro
        idioma:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Idioma90bEnum'
          - $ref: '#/components/schemas/NullEnum'
    Preferencias:
      type: object
      description: Adjunta metadata después de que Serializer.is_valid reconstruye
        errores.
      properties:
        idioma:
          $ref: '#/components/schemas/Idioma704Enum'
        perfil_publico:
          type: boolean
          title: Perfil público
        notif_recomendaciones:
          type: boolean
          title: Notif. recomendaciones
        notif_resenas:
          type: boolean
          title: Notif. reseñas
        notif_novedades:
          type: boolean
          title: Notif. novedades
    PreferenciasLectura:
      type: object
      description: Las cuentas anteriores pueden leerse con idioma nulo, sin permitir
        borrarlo.
      properties:
        idioma:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Idioma704Enum'
          - $ref: '#/components/schemas/NullEnum'
        perfil_publico:
          type: boolean
          title: Perfil público
        notif_recomendaciones:
          type: boolean
          title: Notif. recomendaciones
        notif_resenas:
          type: boolean
          title: Notif. reseñas
        notif_novedades:
          type: boolean
          title: Notif. novedades
      required:
      - idioma
    RefreshSesion:
      type: object
      properties:
        refresh:
          type: string
          description: WIll override cookie.
        access:
          type: string
          readOnly: true
      required:
      - access
    Register:
      type: object
      description: Registro tradicional (CU-001) con los campos del modelo `Usuario`.
      properties:
        password1:
          type: string
          writeOnly: true
        password2:
          type: string
          writeOnly: true
        correo:
          type: string
          format: email
        nombre_usuario:
          type: string
          maxLength: 25
        nombre:
          type: string
          maxLength: 50
        apellido:
          type: string
          maxLength: 50
        fecha_nacimiento:
          type: string
          format: date
        genero:
          $ref: '#/components/schemas/GeneroEnum'
        pais:
          type: string
          maxLength: 2
        acepta_terminos:
          type: boolean
      required:
      - acepta_terminos
      - apellido
      - correo
      - fecha_nacimiento
      - genero
      - nombre
      - nombre_usuario
      - pais
      - password1
      - password2
    ResendEmailVerification:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    RestAuthDetail:
      type: object
      properties:
        detail:
          type: string
          readOnly: true
      required:
      - detail
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    UsuarioDetalles:
      type: object
      description: |-
        Representación del usuario autenticado (endpoints `/api/auth/user/`).

        El serializer por defecto de dj-rest-auth usa `username`/`email`/
        `first_name`/`last_name`, que no existen en `usuarios.Usuario`.
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        correo:
          type: string
          format: email
          readOnly: true
          title: Correo electrónico
          description: Formato correo@dominio.com (CU-001).
        nombre_usuario:
          type: string
          readOnly: true
          title: Nombre de usuario
          description: Alfanumérico, 5-25 caracteres, único (CU-001).
        nombre:
          type: string
          readOnly: true
        apellido:
          type: string
          readOnly: true
        fecha_nacimiento:
          type: string
          format: date
          readOnly: true
          title: Fecha de nacimiento
        genero:
          allOf:
          - $ref: '#/components/schemas/GeneroEnum'
          readOnly: true
          title: Género
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoEnum'
          readOnly: true
          title: Estado de cuenta
        avatar_id:
          type: integer
          readOnly: true
          title: Id de avatar
          description: Identificador dentro del conjunto de  avatares
        fecha_registro:
          type: string
          format: date
          readOnly: true
          title: Fecha de registro
        idioma:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Idioma90bEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - apellido
      - avatar_id
      - correo
      - estado
      - fecha_nacimiento
      - fecha_registro
      - genero
      - idioma
      - nombre
      - nombre_usuario
      - pk
    UsuarioPerfil:
      type: object
      description: 'CU-006: solo nombre, apellido, nombre de usuario y avatar editables.'
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        correo:
          type: string
          format: email
          readOnly: true
          title: Correo electrónico
          description: Formato correo@dominio.com (CU-001).
        nombre_usuario:
          type: string
          maxLength: 25
          pattern: ^[A-Za-z0-9]{5,25}$
        nombre:
          type: string
          maxLength: 50
        apellido:
          type: string
          maxLength: 50
        fecha_nacimiento:
          type: string
          format: date
          readOnly: true
          title: Fecha de nacimiento
        genero:
          allOf:
          - $ref: '#/components/schemas/GeneroEnum'
          readOnly: true
          title: Género
        pais:
          type: string
          title: País
          description: Código ISO 3166-1 alfa-2 (lista en contracts/enums.json)
          maxLength: 2
        avatar_id:
          type: integer
          maximum: 32767
          minimum: 0
          title: Id de avatar
          description: Identificador dentro del conjunto de  avatares
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoEnum'
          readOnly: true
          title: Estado de cuenta
        fecha_registro:
          type: string
          format: date
          readOnly: true
          title: Fecha de registro
        idioma:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Idioma90bEnum'
          - $ref: '#/components/schemas/NullEnum'
        tiene_contrasena_local:
          type: string
          readOnly: true
      required:
      - apellido
      - correo
      - estado
      - fecha_nacimiento
      - fecha_registro
      - genero
      - idioma
      - nombre
      - nombre_usuario
      - pais
      - pk
      - tiene_contrasena_local
    ErrorEntry:
      type: object
      description: Una hoja de validación por campo.
      properties:
        field:
          type: string
          nullable: true
        code:
          type: string
          enum:
          - avatar_invalid
          - birth_date_in_future
          - blank
          - country_invalid
          - current_password_incorrect
          - email_already_used
          - email_or_username_already_used
          - google_authentication_failed
          - invalid
          - invalid_choice
          - list_name_invalid_characters
          - list_name_missing_alphanumeric
          - local_password_unavailable
          - max_length
          - max_value
          - min_length
          - min_value
          - minimum_age
          - not_a_dict
          - 'null'
          - number_not_finite
          - password_entirely_numeric
          - password_no_digit
          - password_no_lower
          - password_no_special
          - password_no_upper
          - password_too_common
          - password_too_short
          - password_too_short_or_long
          - password_too_similar
          - passwords_do_not_match
          - person_name_invalid
          - required
          - review_update_empty
          - terms_not_accepted
          - unique
          - username_already_used
          - username_invalid
          - username_not_allowed
          - validation_error
