# =============================================================================
# FilmAI — CI (GitHub Actions)
# =============================================================================
# Refleja el pre-commit hook local (.husky/pre-commit) pero en la nube, para que
# GitHub bloquee el merge si algo falla aunque el dev no tenga el hook andando.
#
# Jobs:
#   - frontend: ESLint (sin warnings) + Prettier --check
#   - backend:  Ruff check + Ruff format --check
# =============================================================================

name: CI

# Cuándo se ejecuta:
#   - pull_request: en cada PR hacia `main` (lo importante: bloquea el merge).
#   - push:         en cada push directo a `main` (re-verifica lo que ya entró).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # Frontend: ESLint + Prettier
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: ESLint (sin warnings permitidos)
        run: npx eslint . --max-warnings=0

      - name: Prettier (verificar formato)
        run: npx prettier --check .

  # --------------------------------------------------------------------------
  # Backend: Ruff check + Ruff format --check
  # --------------------------------------------------------------------------
  backend:
    name: Backend (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install "ruff>=0.11,<1.0"

      - name: Ruff check (lint)
        run: ruff check .

      - name: Ruff format --check (verificar formato)
        run: ruff format --check .
