# =============================================================================
# FilmAI — CI (GitHub Actions)
# =============================================================================
# Refleja el pre-commit hook local (.husky/pre-commit) pero en la nube, para que
# GitHub bloquee el merge si algo falla aunque el dev no tenga el hook andando.
#
# Jobs:
#   - frontend: ESLint (sin warnings) + Prettier --check
#   - backend:  Ruff check + Ruff format --check + tests (Django)
# =============================================================================

name: CI

# Cuándo se ejecuta:
#   - pull_request: en cada PR hacia `main` (lo importante: bloquea el merge).
#   - push:         en cada push directo a `main` (re-verifica lo que ya entró).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # Frontend: ESLint + Prettier
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: ESLint (sin warnings permitidos)
        run: npx eslint . --max-warnings=0

      - name: Prettier (verificar formato)
        run: npx prettier --check .

  # --------------------------------------------------------------------------
  # Backend: Ruff + Tests (Django)
  # --------------------------------------------------------------------------
  backend:
    name: Backend (ruff + tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: filmai_test
          POSTGRES_USER: filmai_user
          POSTGRES_PASSWORD: filmai_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filmai_user -d filmai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_DB: filmai_test
      POSTGRES_USER: filmai_user
      POSTGRES_PASSWORD: filmai_ci_password
      DATABASE_HOST: localhost
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install "ruff>=0.11,<1.0"

      - name: Ruff check (lint)
        run: ruff check .

      - name: Ruff format --check (verificar formato)
        run: ruff format --check .

      - name: Instalar dependencias del backend
        run: pip install -r requirements.txt

      - name: Correr tests (Django)
        run: python manage.py test --verbosity=2
