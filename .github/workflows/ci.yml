# =============================================================================
# FilmAI — CI (GitHub Actions)
# =============================================================================
# Refleja el pre-commit hook local (.husky/pre-commit) pero en la nube, para que
# GitHub bloquee el merge si algo falla aunque el dev no tenga el hook andando.
#
# Jobs:
#   - frontend: ESLint, TypeScript, catálogo de avatares, Prettier y build
#   - e2e: recorridos de perfil en Chromium con API controlada
#   - backend:  Ruff check + Ruff format --check + tests (Django)
# =============================================================================

name: CI

# Cuándo se ejecuta:
#   - pull_request: en cada PR hacia `main`, `develop` o una rama `feat/**`
#                   (lo importante: bloquea el merge).
#   - push:         en cada push directo a `main` o `develop` (re-verifica lo que entró).
#
# `branches` filtra por la rama DESTINO del PR, no por la de origen. Incluir
# `feat/**` es lo que hace que un PR apilado —uno cuya base es otra rama de
# feature, para que la revisión muestre solo el tramo nuevo— también corra los
# tests. Sin esto solo se disparaba "AI Review" y el PR quedaba sin gate real
# (pasó con el PR #13 de C-04a, 15/09/2026).
#
# Ojo: reapuntar la base de un PR ya abierto NO dispara el workflow, porque
# GitHub emite el evento `edited` y no está entre los tipos por defecto
# (`opened`, `synchronize`, `reopened`). Para forzarlo alcanza con cerrar y
# reabrir el PR, o con pushear un commit.
on:
  pull_request:
    branches:
      - main
      - develop
      - "feat/**"
  push:
    branches: [main, develop]

jobs:
  # --------------------------------------------------------------------------
  # Frontend: ESLint + TypeScript + Prettier + catálogo + build
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + types + format + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: ESLint (sin warnings permitidos)
        run: npx eslint . --max-warnings=0

      - name: Prettier (verificar formato)
        run: npx prettier --check .

      - name: Tests unitarios de frontend
        run: npm run test:unit

      - name: Control de residuos de idioma
        run: npm run i18n:check

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build de producción del frontend
        run: npm run build

      - name: Catálogo de avatares sincronizado
        run: python3 ../scripts/sync_avatars.py --check

      - name: IDs de avatar estables
        run: python3 -m unittest scripts.test_sync_avatars
        working-directory: .

  e2e:
    name: Perfil y reseñas (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium y bibliotecas del sistema
        run: npx playwright install --with-deps chromium

      - name: Recorridos de perfil
        run: npm run test:e2e

  # --------------------------------------------------------------------------
  # Backend: Ruff + Tests (Django)
  # --------------------------------------------------------------------------
  backend:
    name: Backend (ruff + tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Misma imagen que el servicio `db` del docker-compose: las migraciones
        # crean la extensión `vector` (C-04a), que postgres:16-alpine no trae.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: filmai_test
          POSTGRES_USER: filmai_user
          POSTGRES_PASSWORD: filmai_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filmai_user -d filmai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_DB: filmai_test
      POSTGRES_USER: filmai_user
      POSTGRES_PASSWORD: filmai_ci_password
      DATABASE_HOST: localhost
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install "ruff>=0.11,<1.0"

      - name: Ruff check (lint)
        run: ruff check .

      - name: Ruff format --check (verificar formato)
        run: ruff format --check .

      - name: Instalar dependencias del backend
        run: pip install -r requirements.txt

      - name: Correr tests (Django)
        run: python manage.py test --verbosity=2
