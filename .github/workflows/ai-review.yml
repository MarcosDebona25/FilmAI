name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      review-command:
        type: choice
        default: "run"
        options:
          - run
          - run-inline
          - run-context
          - run-summary
          - run-inline-reply
          - run-summary-reply
          - clear-inline
          - clear-summary
        required: true
        description: "Modo de revisión"
      pull-request-number:
        type: string
        required: true
        description: "Número del Pull Request a revisar"

jobs:
  ai-review:
    name: Run AI Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necesario para que git diff funcione correctamente

      - name: Run AI Review
        uses: Nikita-Filonov/ai-review@v0.77.0
        with:
          review-command: ${{ github.event_name == 'pull_request' && 'run' || inputs.review-command }}
        env:
          # --- LLM: OpenRouter ---
          LLM__PROVIDER: "OPENROUTER"
          LLM__META__MODEL: "openrouter/free"
          LLM__META__MAX_TOKENS: "15000"
          LLM__META__TEMPERATURE: "0.3"
          LLM__HTTP_CLIENT__API_URL: "https://openrouter.ai/api/v1"
          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.OPENROUTER_KEY }}

          # --- VCS: GitHub ---
          VCS__PROVIDER: "GITHUB"
          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.pull-request-number }}
          VCS__HTTP_CLIENT__API_URL: "https://api.github.com"
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --- Opciones de revisión ---
          REVIEW__MODE: "FULL_FILE_DIFF"
          REVIEW__DRY_RUN: "false"
          REVIEW__INLINE_COMMENT_FALLBACK: "true"

          # --- Logger ---
          LOGGER__LEVEL: "INFO"
