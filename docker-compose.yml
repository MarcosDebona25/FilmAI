# Uso:
#   docker compose up --build   → levantar todo (primera vez o tras cambios en Dockerfiles)
#   docker compose up           → levantar sin rebuild
#   docker compose down         → frenar y limpiar contenedores
#   docker compose down -v      ↑ + borrar volúmenes (BD y Redis se pierden)

services:
  # 1. PostgreSQL 16 — la base de datos relacional
  # Imagen con la extensión pgvector precompilada, que necesita
  # ProduccionEmbedding (C-04a). OJO: pgvector no publica variantes Alpine,
  # solo Debian, así que este cambio pasa de musl a glibc: al adoptarlo hay
  # que recrear el volumen `pgdata` (las reglas de ordenamiento de texto de
  # los índices difieren entre ambas librerías). Ver docs/decisiones.md.
  db:
    image: pgvector/pgvector:pg16
    container_name: filmai_db
    restart: unless-stopped
    ports:
      - "5432:5432" # expuesto para conectar desde el host (DBeaver, etc.)
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data # los datos sobreviven aunque tires el contenedor
    networks:
      - filmai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis — caché de TMDB + broker de Celery
  redis:
    image: redis:7-alpine
    container_name: filmai_redis
    restart: unless-stopped
    # La contraseña llega por entorno (no en la línea de comandos, que se ve en
    # `docker ps`). `:?` aborta `docker compose up` si falta REDIS_PASSWORD.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?definí REDIS_PASSWORD en .env}
    # `volatile-lru`: al llegar al tope solo desaloja claves con vencimiento (la
    # caché de TMDB y los contadores de throttle). La cola de Celery, que comparte
    # esta instancia, no vence y no se toca.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy volatile-lru
    # Solo loopback: otras máquinas de la red no llegan a Redis. Los demás
    # servicios lo alcanzan por la red interna de Docker (host `redis`).
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - filmai_network
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Backend — Django + Django REST Framework
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: filmai_backend
    restart: unless-stopped
    # Corre como tu usuario del host (UID 1000) en vez de root.
    # Así los archivos generados (startproject, startapp, pycache) quedan con tu dueño y podés editarlos sin sudo. ${UID:-1000} = usa $UID si existe, si no, asume 1000 (el UID estándar del primer usuario en Ubuntu).
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app # monta TODO el código → hot-reload real
      # Los tests de contrato y los comandos `exportar_contrato`/`exportar_enums`
      # resuelven estos archivos como BASE_DIR.parent (la raíz del repo). Sin
      # estos montajes, dentro del contenedor esa raíz es `/` y no existen.
      - ./contracts:/contracts
      - ./traducciones:/traducciones:ro
      # Los tests de seguridad (F1) leen el compose como BASE_DIR.parent.
      - ./docker-compose.yml:/docker-compose.yml:ro
    depends_on:
      db:
        condition: service_healthy # no arranca hasta que PostgreSQL responda
      redis:
        condition: service_healthy
    networks:
      - filmai_network

  # 4. Frontend — Next.js 15 + Tailwind + Shadcn
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: filmai_frontend
    restart: unless-stopped
    # Misma razón que en backend: que los archivos generados queden con tu dueño.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Next.js expone a la app solo las variables prefijadas NEXT_PUBLIC_*.
      # Se reutiliza el mismo client_id de Google del .env global.
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    volumes:
      - ./frontend:/app # monta TODO el código → hot-reload real
      - /app/node_modules # volumen anónimo: no pisar node_modules del contenedor
    depends_on:
      - backend
    networks:
      - filmai_network

  # 5. Celery worker — procesa tareas en segundo plano (hoy: materializar_produccion y
  # generar_embedding de C-04a; la sync y el backfill de C-04b)
  # Misma imagen que el backend (mismo código, mismas dependencias), pero en
  # vez de levantar el servidor HTTP corre el proceso que escucha la cola de
  # tareas en Redis y las ejecuta una por una.
  #
  # El comando va envuelto en `watchmedo auto-restart` porque Celery, a
  # diferencia del runserver de Django, NO recarga código solo: sin esto el
  # worker sigue ejecutando en memoria la versión vieja de cada tarea que
  # edites, en silencio y sin ningún error. Es una envoltura de desarrollo; en
  # producción se despliega una imagen nueva y se corre `celery` directo.
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: filmai_celery_worker
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    command: >
      watchmedo auto-restart --directory=/app --pattern=*.py --recursive --
      celery -A filmai worker -l info
    env_file:
      - .env
    environment:
      # Las migraciones y el superuser los corre solo el backend: si ambos
      # contenedores migraran, tocarían la misma base al mismo tiempo.
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - filmai_network

  # 6. Celery Beat — el reloj que dispara las tareas programadas (C-04b)
  # No ejecuta nada: a la hora que dice CELERY_BEAT_SCHEDULE (settings.py) pone
  # la tarea en la cola de Redis, y el celery-worker la levanta como cualquier
  # otra. Va en un contenedor aparte porque tiene que haber EXACTAMENTE UNO:
  # dos relojes = cada tarea disparada dos veces. Las tareas son idempotentes,
  # así que no corrompería nada, pero duplicaría el tráfico a TMDB sin motivo.
  #
  # Dos diferencias con el worker, ambas a propósito:
  #   - `--schedule=/tmp/...`: beat anota en un archivo cuándo corrió cada
  #     tarea. Sin esta opción lo escribiría en /app, que es el bind mount de
  #     ./backend, y aparecería en el repo. En /tmp se pierde al recrear el
  #     contenedor, y está bien: al arrancar recalcula desde el schedule.
  #   - Sin watchmedo: beat solo lee el horario de settings.py, que cambia
  #     rara vez. Si lo cambiás, `docker compose restart celery-beat` (el bind
  #     mount hace que el restart vea el archivo nuevo sin reconstruir).
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: filmai_celery_beat
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    command: celery -A filmai beat -l info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - filmai_network

# Volúmenes con nombre — persisten datos aunque hagas docker compose down
volumes:
  pgdata:
  redisdata:

# Red interna — los servicios se encuentran por su nombre de servicio. Ej: el backend se conecta a PostgreSQL con host=db, no con localhost
networks:
  filmai_network:
    driver: bridge